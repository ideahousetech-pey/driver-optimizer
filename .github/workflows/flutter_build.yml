name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (WAJIB untuk Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Analyze (optional tapi bagus)
      - name: Analyze project
        run: flutter analyze

      # 6. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-optimizer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Clean Flutter
        run: flutter clean

      - name: Delete pub cache
        run: rm -rf ~/.pub-cache